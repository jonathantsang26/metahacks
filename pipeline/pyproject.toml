[project]
name = "ember-pipeline"
version = "0.1.0"
description = "Offline data pipeline for Sentinel Ember: builds web/public/data/<fire>/"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "requests>=2.31",
  "pyyaml>=6",
  "openai>=1.40",
  "rasterio>=1.4.4",
  "scipy>=1.17.1",
  "numba>=0.68.1",
  "shapely>=2.2.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Mask decoding for SAM 3.1 output (Meta's parser); only the vision steps need it.
sam = ["meta-sam-parser>=0.1"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
